<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PadlockPuzzle</title>
    <!-- Escapp Client Styles -->
    <link rel="stylesheet" href="escapp.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a2e;
        }

        #background-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 0;
        }

        #unity-container {
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #unity-canvas {
            width: 100%;
            height: 100%;
            background: transparent;
        }

        #unity-loading-bar {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        #unity-logo {
            width: 100px;
            height: 100px;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="%230f3460" stroke="%23e94560" stroke-width="3"/><rect x="40" y="30" width="20" height="35" rx="3" fill="%23e94560"/><circle cx="50" cy="75" r="5" fill="%23e94560"/></svg>') center/contain no-repeat;
        }

        #unity-progress-bar-empty {
            width: 180px;
            height: 6px;
            background: #0f3460;
            border-radius: 3px;
            overflow: hidden;
        }

        #unity-progress-bar-full {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #e94560, #ff6b6b);
            transition: width 0.2s;
        }

        #loading-text {
            color: #aaa;
            font-size: 12px;
            font-family: sans-serif;
        }
    </style>
</head>
<body>
    <div id="background-image"></div>
    <div id="unity-container">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
            <div id="loading-text">Loading...</div>
        </div>
    </div>

    <!-- Escapp Client Library (local) -->
    <script src="escapp.js"></script>

    <script>
        // ===========================================
        // ESCAPP INSTANCE AND CONFIGURATION
        // ===========================================

        window.escappInstance = null;
        window.PADLOCK_CONFIG = null;

        // Get parent's escapp instance if available
        function getParentEscapp() {
            try {
                if (window.parent && window.parent.ESCAPP_APP && window.parent.ESCAPP_APP.escapp) {
                    console.log('Found ESCAPP_APP.escapp in parent');
                    return window.parent.ESCAPP_APP.escapp;
                }
                if (window.ESCAPP_APP && window.ESCAPP_APP.escapp) {
                    console.log('Found ESCAPP_APP.escapp in current window');
                    return window.ESCAPP_APP.escapp;
                }
            } catch (e) {
                console.log('Could not access parent ESCAPP_APP:', e);
            }
            return null;
        }

        // Initialize Escapp and get configuration using the client API
        function initializeEscapp() {
            console.log('=== initializeEscapp called ===');

            // First check if parent already has an escapp instance
            var parentEscapp = getParentEscapp();
            if (parentEscapp) {
                console.log('SUCCESS: Using parent ESCAPP instance');
                window.escappInstance = parentEscapp;
                buildPadlockConfig();
                return;
            }

            // Try to create our own ESCAPP instance
            if (typeof ESCAPP !== 'undefined') {
                try {
                    // ESCAPP will automatically find settings from environment
                    // using its internal _getAppSettingsFromEnvironment method
                    var escapp = new ESCAPP({
                        silent: true,
                        notifications: false
                    });

                    window.escappInstance = escapp;
                    console.log('SUCCESS: Created new ESCAPP instance');
                    buildPadlockConfig();
                    return;
                } catch (err) {
                    console.error('Error creating ESCAPP instance:', err);
                }
            } else {
                console.error('ESCAPP library not loaded');
            }

            // Fallback to mock
            console.warn('WARNING: Using mock mode (solutions will NOT be sent to server)');
            window.escappInstance = createMockEscapp();
            buildPadlockConfigFromFallback();
        }

        // Build PADLOCK_CONFIG using the escapp client's getAppSettings method
        function buildPadlockConfig() {
            var appSettings = null;
            var clientSettings = null;

            // Use escapp client's getAppSettings() method
            if (window.escappInstance && typeof window.escappInstance.getAppSettings === 'function') {
                appSettings = window.escappInstance.getAppSettings();
                console.log('Got appSettings from escapp.getAppSettings():', appSettings);
            }

            // Also try getSettings() for client settings
            if (window.escappInstance && typeof window.escappInstance.getSettings === 'function') {
                clientSettings = window.escappInstance.getSettings();
                console.log('Got clientSettings from escapp.getSettings():', clientSettings);
            }

            // Get puzzleId from various sources
            var puzzleId = 1;
            if (clientSettings && clientSettings.linkedPuzzleIds && clientSettings.linkedPuzzleIds[0]) {
                puzzleId = clientSettings.linkedPuzzleIds[0];
            } else if (appSettings && appSettings.puzzleId) {
                puzzleId = appSettings.puzzleId;
            }

            window.PADLOCK_CONFIG = {
                positions: (appSettings && appSettings.solutionLength) || (appSettings && appSettings.positions) || 4,
                puzzleId: puzzleId,
                solution: (appSettings && appSettings.solution) || null,
                endpoint: (clientSettings && clientSettings.endpoint) || null,
                user: (clientSettings && clientSettings.user) || null,
                backgroundImage: (appSettings && appSettings.backgroundImage) || null,
                backgroundColor: (appSettings && appSettings.backgroundColor) || null,
                unlockedText: (appSettings && appSettings.unlockedText) || "UNLOCKED!"
            };

            console.log('Built PADLOCK_CONFIG:', window.PADLOCK_CONFIG);
            applyBackground();
        }

        // Fallback config builder when no escapp instance is available
        function buildPadlockConfigFromFallback() {
            window.PADLOCK_CONFIG = {
                positions: 4,
                puzzleId: 1,
                solution: null,
                endpoint: null,
                user: null,
                backgroundImage: null,
                backgroundColor: null,
                unlockedText: "UNLOCKED!"
            };
            console.log('Using fallback PADLOCK_CONFIG:', window.PADLOCK_CONFIG);
        }

        // Mock Escapp for offline/testing
        function createMockEscapp() {
            return {
                checkPuzzle: function(puzzleId, userSolution, options, callback) {
                    console.log('[Mock] checkPuzzle:', puzzleId, userSolution);
                    setTimeout(function() {
                        callback(false, { success: false, message: 'Mock mode - no server' });
                    }, 300);
                },
                submitPuzzle: function(puzzleId, userSolution, options, callback) {
                    this.checkPuzzle(puzzleId, userSolution, options, callback);
                },
                validate: function(cb) { cb({ success: true }); },
                getSolvedPuzzles: function() { return []; },
                getAppSettings: function() { return null; },
                getSettings: function() { return null; }
            };
        }

        // Apply background image/color if provided
        function applyBackground() {
            var bgElement = document.getElementById('background-image');
            if (!bgElement || !window.PADLOCK_CONFIG) return;

            if (window.PADLOCK_CONFIG.backgroundImage) {
                bgElement.style.backgroundImage = 'url(' + window.PADLOCK_CONFIG.backgroundImage + ')';
                console.log('Applied background image:', window.PADLOCK_CONFIG.backgroundImage);
            }

            if (window.PADLOCK_CONFIG.backgroundColor) {
                document.body.style.background = window.PADLOCK_CONFIG.backgroundColor;
                console.log('Applied background color:', window.PADLOCK_CONFIG.backgroundColor);
            }
        }

        // ===========================================
        // ESCAPP BRIDGE FOR UNITY
        // ===========================================

        window.EscappCheckSolution = function(puzzleId, solution, gameObjectName, callbackMethod) {
            console.log('=== EscappCheckSolution ===');
            console.log('puzzleId:', puzzleId, 'solution:', solution);

            if (!window.escappInstance) {
                console.error('Escapp not initialized');
                if (window.unityInstance) {
                    window.unityInstance.SendMessage(gameObjectName, callbackMethod,
                        JSON.stringify({ success: false, message: 'Escapp not initialized' }));
                }
                return;
            }

            // Try submitPuzzle first, then checkPuzzle as fallback
            var methodToUse = null;
            if (typeof window.escappInstance.submitPuzzle === 'function') {
                methodToUse = 'submitPuzzle';
            } else if (typeof window.escappInstance.checkPuzzle === 'function') {
                methodToUse = 'checkPuzzle';
            }

            console.log('Using method:', methodToUse);

            if (!methodToUse) {
                console.error('No submitPuzzle or checkPuzzle method found');
                if (window.unityInstance) {
                    window.unityInstance.SendMessage(gameObjectName, callbackMethod,
                        JSON.stringify({ success: false, message: 'Escapp API not available' }));
                }
                return;
            }

            try {
                window.escappInstance[methodToUse](puzzleId, solution, {}, function(success, response) {
                    console.log(methodToUse + ' callback received:', success, response);

                    var result = JSON.stringify({
                        success: success,
                        message: success ? 'Correct!' : (response && response.message ? response.message : 'Wrong combination!')
                    });

                    console.log('Sending to Unity:', result);
                    if (window.unityInstance) {
                        window.unityInstance.SendMessage(gameObjectName, callbackMethod, result);
                    }
                });
            } catch (err) {
                console.error('Error calling ' + methodToUse + ':', err);
                if (window.unityInstance) {
                    window.unityInstance.SendMessage(gameObjectName, callbackMethod,
                        JSON.stringify({ success: false, message: 'Error: ' + err.message }));
                }
            }
        };

        // ===========================================
        // UNITY WEBGL LOADER
        // ===========================================

        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/WebGL.loader.js";
        var config = {
            dataUrl: buildUrl + "/WebGL.data",
            frameworkUrl: buildUrl + "/WebGL.framework.js",
            codeUrl: buildUrl + "/WebGL.wasm",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "PadlockPuzzle",
            productVersion: "0.1",
        };

        var canvas = document.querySelector("#unity-canvas");
        var loadingBar = document.querySelector("#unity-loading-bar");
        var progressBarFull = document.querySelector("#unity-progress-bar-full");
        var loadingText = document.querySelector("#loading-text");

        loadingBar.style.display = "flex";

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = function() {
            createUnityInstance(canvas, config, function(progress) {
                progressBarFull.style.width = (100 * progress) + "%";
                loadingText.textContent = Math.round(100 * progress) + "%";
            }).then(function(unityInstance) {
                loadingBar.style.display = "none";
                window.unityInstance = unityInstance;

                // Initialize Escapp and build config using client API
                initializeEscapp();

            }).catch(function(message) {
                alert(message);
            });
        };

        document.body.appendChild(script);
    </script>
</body>
</html>
